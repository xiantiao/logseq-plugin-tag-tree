name: Build plugin

on:
  push:
    # 推送任意 tag（如 v3.0.0）时触发：构建 → 打包 zip → 创建 Release 并附带产物
    tags:
      - "*"

env:
  PLUGIN_NAME: logseq-plugin-tag-tree

jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN 需要写权限才能创建 Release 并上传附件
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: |
          npm install -g pnpm@9
          pnpm install
          pnpm build

      - name: Package
        run: |
          mkdir ${{ env.PLUGIN_NAME }}
          cp README.md package.json logo.svg demo-basic.gif demo-filter.gif ${{ env.PLUGIN_NAME }}
          mv dist ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}

      - name: Create Release and upload assets
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          draft: false
          prerelease: false
          # Logseq 市场约定：Release 附带插件 zip + package.json
          artifacts: ./${{ env.PLUGIN_NAME }}.zip, ./package.json
